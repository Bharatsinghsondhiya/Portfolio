<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog // Bharat Singh</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Premium Styling for Standalone Blog Page -->
    <style>
        :root {
            --bg-dark: #030306;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-orange: #f05a28;
            --accent-pink: #db2777;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: none; /* override style.css background */
        }

        /* Ambient Glows */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(240, 90, 40, 0.08) 0%, rgba(219, 39, 119, 0.04) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 10%; right: -100px; }

        /* Top Sticky Header */
        .article-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            z-index: 100;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--accent-orange);
        }

        .logo-cursive {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #fff 60%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Article Container */
        .article-container {
            max-width: 1100px;
            margin: 60px auto 100px auto;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        /* Back to top/home footer links */
        .article-footer {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 820px;
            margin-left: auto;
            margin-right: auto;
        }

        .footer-logo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-logo span {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Responsive overrides */
        @media (max-width: 768px) {
            .article-header {
                padding: 16px 24px;
            }
            .article-container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Glow effects -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Sticky Header -->
    <header class="article-header">
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Portfolio
        </a>
        <a href="index.html" class="logo-cursive">Bharat Singh</a>
    </header>

    <!-- Main Content Panel -->
    <article class="article-container">
        <div class="sec-header-center" style="margin-top: 40px;">
            <span class="sec-label">BLOG</span>
            <h2 class="sec-title" style="color: #fff;">Insights & Articles</h2>
        </div>

        <div class="notes-grid reveal-group" id="blogs-container">
            <p>Loading blogs...</p>
        </div>

        <footer class="article-footer">
            <a href="index.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Portfolio
            </a>
            <div class="footer-logo">
                <span class="logo-cursive">Bharat Singh</span>
                <span>Product Creator & Developer</span>
            </div>
        </footer>
    </article>

    <script>
        function stripHtml(html) {
            let tmp = document.createElement("DIV");
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || "";
        }

        async function loadBlogs() {
            try {
                const res = await fetch('http://localhost:3000/api/blogs');
                if (!res.ok) throw new Error('Failed to fetch blogs');
                const blogs = await res.json();
                
                const container = document.getElementById('blogs-container');
                container.innerHTML = '';

                if (blogs.length === 0) {
                    container.innerHTML = '<p>No blogs available.</p>';
                    return;
                }

                blogs.forEach((blog, index) => {
                    const tagClass = index % 2 === 0 ? 'tag-success' : 'tag-primary';
                    const snippet = stripHtml(blog.content).substring(0, 100) + '...';

                    const card = document.createElement('div');
                    card.className = 'note-card glass-panel tilt-card';
                    card.style = 'cursor: pointer; padding: 0; overflow: hidden;';
                    card.onclick = () => window.location.href = `blog.html?id=${blog.id}`;

                    card.innerHTML = `
                        <img src="${blog.img}" alt="${blog.title}" style="width: 100%; height: 180px; object-fit: cover;">
                        <div style="padding: 24px;">
                            <div class="note-meta">
                                <span class="note-tag ${tagClass}">${blog.tag}</span>
                                <span class="note-date text-cyan">${blog.date}</span>
                            </div>
                            <h3>${blog.title}</h3>
                            <p class="text-muted">${snippet}</p>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('blogs-container').innerHTML = '<p>Error loading blogs. Make sure the backend server is running.</p>';
            }
        }

        loadBlogs();
    </script>
</body>

</html>
