<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Article // Bharat Singh</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Premium Styling for Standalone Blog Page -->
    <style>
        :root {
            --bg-dark: #030306;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-orange: #f05a28;
            --accent-pink: #db2777;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Glows */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(240, 90, 40, 0.08) 0%, rgba(219, 39, 119, 0.04) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 10%; right: -100px; }

        /* Top Sticky Header */
        .article-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            z-index: 100;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--accent-orange);
        }

        .logo-cursive {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #fff 60%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Article Container */
        .article-container {
            max-width: 820px;
            margin: 60px auto 100px auto;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        /* Meta header details */
        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            margin-bottom: 20px;
        }

        .meta-tag {
            background: rgba(240, 90, 40, 0.15);
            border: 1px solid rgba(240, 90, 40, 0.3);
            color: var(--accent-orange);
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .meta-time {
            color: var(--text-muted);
        }

        /* Article Title */
        .article-title {
            font-size: 44px;
            font-weight: 700;
            line-height: 1.25;
            color: #fff;
            margin-bottom: 30px;
        }

        /* Large Hero Image */
        .article-hero-img-wrapper {
            width: 100%;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 45px;
            background: #030306;
        }

        .article-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Article Content Details */
        .article-body {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
        }

        .article-body p {
            margin-bottom: 24px;
        }

        .article-body h4 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin: 40px 0 15px 0;
        }

        .article-body ul, .article-body ol {
            margin: 0 0 24px 24px;
        }

        .article-body li {
            margin-bottom: 8px;
        }

        /* Code Block Styling */
        .code-block {
            background: rgba(3, 3, 6, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: #a78bfa;
            overflow-x: auto;
            margin: 30px 0;
            white-space: pre;
        }

        .code-block code {
            font-family: inherit;
            color: inherit;
        }

        /* Back to top/home footer links */
        .article-footer {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-logo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-logo span {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Responsive overrides */
        @media (max-width: 768px) {
            .article-header {
                padding: 16px 24px;
            }
            .article-title {
                font-size: 32px;
            }
            .article-hero-img-wrapper {
                height: 240px;
                margin-bottom: 30px;
            }
            .article-container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Glow effects -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Sticky Header -->
    <header class="article-header">
        <a href="blogs.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Portfolio
        </a>
        <a href="index.html" class="logo-cursive">Bharat Singh</a>
    </header>

    <!-- Main Content Panel -->
    <article class="article-container">
        <header>
            <div class="article-meta">
                <span id="blog-tag" class="meta-tag">AI & AGENTS</span>
                <span id="blog-date" class="meta-time">MAY 28, 2026 // 5 MIN READ</span>
            </div>
            <h1 id="blog-title" class="article-title">Article Title</h1>
        </header>

        <div class="article-hero-img-wrapper">
            <img id="blog-hero" src="" alt="Blog Hero Image" class="article-hero-img">
        </div>

        <div id="blog-body" class="article-body">
            <!-- Dynamically populated -->
        </div>

        <footer class="article-footer">
            <a href="blogs.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Read More Articles
            </a>
            <div class="footer-logo">
                <span class="logo-cursive">Bharat Singh</span>
                <span>Product Creator & Developer</span>
            </div>
        </footer>
    </article>

    <!-- Parse post parameter and dynamically load article -->
    <script>
        const blogPosts = {
            'agentic-workflows': {
                title: 'Building Reliable Agentic Workflows',
                date: 'MAY 28, 2026 // 5 MIN READ',
                tag: 'AI & AGENTS',
                img: 'file:///C:/Users/bhara/.gemini/antigravity/brain/5bfe4a88-0b5c-4122-853c-1ce974e8fdb2/blog_agentic_1780238692185.png',
                content: `
                    <p>Agentic workflows represent a paradigm shift in how we integrate Large Language Models into software systems. Instead of single-shot prompts, we build loops where the model acts, observes, and adapts.</p>
                    
                    <h4>The Loop Architecture</h4>
                    <p>A typical reliable agent loop consists of three distinct states:</p>
                    <ul>
                        <li><strong>Planning:</strong> Breaking down a complex query into sequential tasks.</li>
                        <li><strong>Execution:</strong> Invoking specific APIs or tools (e.g. database querying, search, code running).</li>
                        <li><strong>Evaluation:</strong> Verifying if the output meets the requirements, and looping back if corrections are needed.</li>
                    </ul>

                    <h4>Handling Tool Failures</h4>
                    <p>The main failure mode of agentic loops is tool hallucinations or API rate limits. To solve this, we implement state machine validations. If a tool call fails, the validation layer catches the exception and feeds the error back into the LLM context, instructing it to self-correct.</p>
                    
                    <div class="code-block"><code>// Example retry logic in validation layer
try {
    const output = await executeTool(call.name, call.args);
    return validate(output);
} catch (err) {
    return { error: true, message: err.message };
}</code></div>

                    <p>By treating LLM tool use as a standard state machine with timeouts and fallbacks, we can build highly stable, autonomous systems.</p>
                `
            },
            'high-throughput-db': {
                title: 'Scaling Postgres for High-Throughput APIs',
                date: 'MAY 24, 2026 // 8 MIN READ',
                tag: 'DATABASE',
                img: 'file:///C:/Users/bhara/.gemini/antigravity/brain/5bfe4a88-0b5c-4122-853c-1ce974e8fdb2/blog_postgres_1780238716213.png',
                content: `
                    <p>Relational databases are often the bottleneck in modern high-throughput web applications. While scaling horizontally is easy for stateless compute, scaling Postgres requires smart connection management and indexing strategies.</p>
                    
                    <h4>1. Connection Pool Optimization</h4>
                    <p>Each connection in Postgres consumes memory. At thousands of concurrent requests, direct connections will crash the server. We place an edge pooler like PgBouncer in transaction mode to pool connections efficiently, keeping target DB connections stable.</p>
                    
                    <h4>2. Indexing Strategy</h4>
                    <p>Composite indexes must match the query filter path. If you filter by tenant_id and sort by created_at, a composite index on <code>(tenant_id, created_at DESC)</code> is critical to prevent sequential database scans.</p>

                    <div class="code-block"><code>CREATE INDEX idx_tenant_created
ON applications (tenant_id, created_at DESC);</code></div>
                    
                    <p>Combining connection pooling with optimized indexing can reduce average API latency from 200ms to under 15ms.</p>
                `
            },
            'state-sync': {
                title: 'Real-time State Synchronization In B2B Apps',
                date: 'MAY 15, 2026 // 6 MIN READ',
                tag: 'SYSTEMS',
                img: 'file:///C:/Users/bhara/.gemini/antigravity/brain/5bfe4a88-0b5c-4122-853c-1ce974e8fdb2/blog_sync_1780238740390.png',
                content: `
                    <p>Collaborative B2B platforms require real-time state updates to keep multiple clients synchronized. Selecting the right protocol is critical to balance server CPU cycles and client-side complexity.</p>
                    
                    <h4>WebSockets vs Server-Sent Events (SSE)</h4>
                    <p>For bidirectional operations (like chat or live multi-user editing), <strong>WebSockets</strong> are the industry standard. However, for unidirectional push notifications and read-only dashboard updates, <strong>SSE</strong> is much simpler to implement, utilizes HTTP/2 naturally, and handles reconnections automatically.</p>
                    
                    <h4>State Conflict Resolution</h4>
                    <p>When two users edit the same field simultaneously, conflicts occur. We use Operational Transformation (OT) or Conflict-Free Replicated Data Types (CRDTs) to merge client states locally without requiring heavy locking mechanisms on the DB.</p>
                `
            }
        };

        // Get query parameter ID
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id') || 'agentic-workflows';
        
        const post = blogPosts[postId] || blogPosts['agentic-workflows'];

        // Populate elements
        document.getElementById('blog-tag').innerText = post.tag;
        document.getElementById('blog-date').innerText = post.date;
        document.getElementById('blog-title').innerText = post.title;
        document.getElementById('blog-hero').src = post.img;
        document.getElementById('blog-hero').alt = post.title;
        document.getElementById('blog-body').innerHTML = post.content;
        document.title = `${post.title} // Bharat Singh`;
    </script>
</body>

</html>
