<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Article | Bharat Singh</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Premium Styling for Standalone Blog Page -->
    <style>
        :root {
            --bg-dark: #030306;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-main: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            --accent-orange: #f05a28;
            --accent-pink: #db2777;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.7;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient Glows */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(240, 90, 40, 0.08) 0%, rgba(219, 39, 119, 0.04) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: 10%; right: -100px; }

        /* Top Sticky Header */
        .article-header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            z-index: 100;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            font-family: var(--font-mono);
            font-size: 13px;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: var(--accent-orange);
        }

        .logo-cursive {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(135deg, #fff 60%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Article Container */
        .article-container {
            max-width: 820px;
            margin: 60px auto 100px auto;
            padding: 0 24px;
            position: relative;
            z-index: 10;
        }

        /* Meta header details */
        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: var(--font-mono);
            font-size: 11px;
            margin-bottom: 20px;
        }

        .meta-tag {
            background: rgba(240, 90, 40, 0.15);
            border: 1px solid rgba(240, 90, 40, 0.3);
            color: var(--accent-orange);
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }

        .meta-time {
            color: var(--text-muted);
        }

        /* Article Title */
        .article-title {
            font-size: 44px;
            font-weight: 700;
            line-height: 1.25;
            color: #fff;
            margin-bottom: 30px;
        }

        /* Large Hero Image */
        .article-hero-img-wrapper {
            width: 100%;
            height: 380px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 45px;
            background: #030306;
        }

        .article-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Article Content Details */
        .article-body {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-main);
        }

        .article-body p {
            margin-bottom: 24px;
        }

        .article-body h4 {
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            margin: 40px 0 15px 0;
        }

        .article-body ul, .article-body ol {
            margin: 0 0 24px 24px;
        }

        .article-body li {
            margin-bottom: 8px;
        }

        /* Code Block Styling */
        .code-block {
            background: rgba(3, 3, 6, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: #a78bfa;
            overflow-x: auto;
            margin: 30px 0;
            white-space: pre;
        }

        .code-block code {
            font-family: inherit;
            color: inherit;
        }

        /* Back to top/home footer links */
        .article-footer {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-logo {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .footer-logo span {
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
        }

        /* Loading Spinner */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            width: 100%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(240, 90, 40, 0.2);
            border-top-color: var(--accent-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive overrides */
        @media (max-width: 768px) {
            .article-header {
                padding: 16px 24px;
            }
            .article-title {
                font-size: 32px;
            }
            .article-hero-img-wrapper {
                height: 240px;
                margin-bottom: 30px;
            }
            .article-container {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>
    <!-- Glow effects -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- Sticky Header -->
    <header class="article-header">
        <a href="blogs.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Portfolio
        </a>
        <a href="index.html" class="logo-cursive">Bharat Singh</a>
    </header>

    <!-- Main Content Panel -->
    <article class="article-container">
        <div id="loading-state" class="loader-container">
            <div class="spinner"></div>
        </div>

        <div id="article-content" style="display: none;">
            <header>
                <div class="article-meta">
                    <span id="blog-tag" class="meta-tag"></span>
                    <span id="blog-date" class="meta-time"></span>
                </div>
                <h1 id="blog-title" class="article-title"></h1>
            </header>

            <div class="article-hero-img-wrapper">
                <img id="blog-hero" src="" alt="" class="article-hero-img">
            </div>

            <div id="blog-body" class="article-body">
                <!-- Dynamically populated -->
            </div>
        </div>

        <footer class="article-footer">
            <a href="blogs.html" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Read More Articles
            </a>
            <div class="footer-logo">
                <span class="logo-cursive">Bharat Singh</span>
                <span>Product Creator & Developer</span>
            </div>
        </footer>
    </article>

    <!-- Parse post parameter and dynamically load article -->
    <script>
        async function loadBlog() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const loadingState = document.getElementById('loading-state');
            const articleContent = document.getElementById('article-content');
            
            if (!postId) {
                loadingState.style.display = 'none';
                articleContent.style.display = 'block';
                document.getElementById('blog-body').innerHTML = '<p>No blog ID provided.</p>';
                return;
            }

            try {
                const res = await fetch(`http://localhost:3000/api/blogs/${postId}`);
                if (!res.ok) throw new Error('Blog not found');
                const post = await res.json();

                // Populate elements
                document.getElementById('blog-tag').innerText = post.tag;
                document.getElementById('blog-date').innerText = post.date;
                document.getElementById('blog-title').innerText = post.title;
                document.getElementById('blog-hero').src = post.img;
                document.getElementById('blog-hero').alt = post.title;
                document.getElementById('blog-body').innerHTML = post.content;
                document.title = `${post.title} // Bharat Singh`;
                
                loadingState.style.display = 'none';
                articleContent.style.display = 'block';
            } catch (err) {
                console.error(err);
                loadingState.style.display = 'none';
                articleContent.style.display = 'block';
                document.getElementById('blog-body').innerHTML = '<p>Error loading blog post. Make sure the backend server is running.</p>';
            }
        }

        loadBlog();
    </script>
</body>

</html>
